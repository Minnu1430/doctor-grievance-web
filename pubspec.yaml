name: mobile
description: "Doctor Grievance Management and Resolution System for Telangana Council of Hospitals"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Formatting & Internationalization
  intl: ^0.19.0
  path: ^1.9.0

  # File & Image Pickers
  file_picker: ^8.0.5
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  open_filex: ^4.4.0

  # Charts for Dashboards and Reports
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
